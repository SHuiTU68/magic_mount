name: Build Module

on:
  push:
    tags: [ "*" ]
    branches: [ "main" ]
  workflow_call:
  workflow_dispatch:
jobs:
  build-lkm:
    uses: ./.github/workflows/build-lkm.yml
    with:
      build_all: true

  build-module:
    needs: build-lkm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install toolchain
        run: |
          rustup default stable
          rustup update stable
          cargo install cargo-ndk
          rustup target install aarch64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: my_lua_module
          cache-targets: false
      
      - name: Build Rust
        run: |
          cd my_lua_module
          cargo ndk -t aarch64-linux-android -- build --release

      - name: Download lkm
        uses: actions/download-artifact@v4
        with:
          name: lkm
          path: lkm

      - name: copy to output
        run: |
          mkdir -p build/lkm
          cp my_lua_module/target/aarch64-linux-android/release/libmagic_mount.so build/
          upx --best --lzma --android-shlib build/libmagic_mount.so
          cp module/* build/
          cp lkm/*.ko build/lkm/
          ls -lh build build/lkm

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: magic_mount
          path: build

      # Tags are the release channel: module.json points its downloadUrl at
      # releases/latest/download/magic_mount.zip, so a tag has to produce that
      # exact asset.  Branch pushes only upload the workflow artifact.
      - name: Package
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          (cd build && zip -r9 ../magic_mount.zip .)
          ls -lh magic_mount.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" magic_mount.zip --clobber \
            || gh release create "$GITHUB_REF_NAME" magic_mount.zip --generate-notes